server:
  port: 8080
  servlet:
    context-path: /api-hybridchatbot
spring:
  application:
    name: bc-hybridchatbot
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        username: nacos
        password: nacos
        register-enabled: true
        service: bc-hybridchatbot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hybridchatbot?currentSchema=hybridchatbot}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:chatbot}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    properties:
      hibernate:
        ejb:
          interceptor-org
        format_sql: true
        globally_quoted_identifiers: true
  mybatis:
    mapper-locations: classpath:mapper/*.xml

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

jwt:
  secret: SecurityHibridChatbotSecretKeyJwt1
  expiration: 86400000

flask:
  chatbot-url: ${FLASK_URL:http://localhost:5001/process-message}