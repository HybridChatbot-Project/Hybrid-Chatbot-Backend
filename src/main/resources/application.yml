server:
  port: ${PORT:8080}
  servlet:
    context-path: /api-hybridchatbot
spring:
  application:
    name: bc-hybridchatbot
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        username: nacos
        password: nacos
        register-enabled: false
        service: bc-hybridchatbot
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    properties:
      hibernate:
        ejb:
          interceptor-org
        format_sql: true
        globally_quoted_identifiers: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mybatis:
    mapper-locations: classpath:mapper/*.xml

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

flask:
  chatbot-url: ${FLASK_URL:https://hybridchatbot-data-processor-v2.onrender.com/process-message}